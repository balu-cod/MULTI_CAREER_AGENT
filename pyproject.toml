[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-agent-system"
version = "6.5.0"
description = "Personal, human-in-the-loop job-search assistant"
requires-python = ">=3.10"
dependencies = [
  "requests==2.32.3",
  "beautifulsoup4==4.12.3",
  "playwright==1.47.0",
  "reportlab==4.2.5",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.7.1"]

[tool.setuptools]
packages = ["live", "live.custom"]
package-data = { live = ["pipeline.json", "cert_catalog.json"] }

[tool.ruff]
line-length = 200
[tool.pytest.ini_options]
testpaths = ["tests"]
